

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | MathsWorld</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/auth.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

</head>

<body>


<main class="auth-page">

<div class="auth-container">

    <section class="auth-card">

        <!-- HEADER -->

        <div class="auth-card-header">

            <div class="auth-icon">

                <i class="fa-solid fa-right-to-bracket"></i>

            </div>

            <h2>Welcome Back</h2>

            <p>
                Login to your MathsWorld account
            </p>

        </div>


        <!-- LOGIN FORM -->

        <form id="loginForm" class="auth-form" autocomplete="off">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="loginEmail">
                    Email Address
                </label>

                <div class="input-box">

                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="off"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="loginPassword"
                        aria-label="Show password"
                    >

                        <i class="fa-regular fa-eye"></i>

                    </button>

                </div>

            </div>

            <a href="forgot-password.php" class="forgot-password">
                Forgot Password?
            </a>


            <!-- REMEMBER -->

            <label class="terms-check">

                <input
                    type="checkbox"
                    id="remember"
                >

                <span>
                    Remember me
                </span>

            </label>


            <!-- LOGIN BUTTON -->

            <button type="submit" class="auth-btn" id="loginButton">
                <span>Login</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>


            <!-- MESSAGE -->

            <div
                id="loginMessage"
                class="auth-message"
            ></div>

        </form>


        <!-- REGISTER -->

        <div class="auth-divider">

            <span>Don't have an account?</span>

        </div>


        <a
            href="register.html"
            class="register-btn"
        >

            <i class="fa-solid fa-user-plus"></i>

            Create Student Account

        </a>

        <div class="back">
            <a href="./index.html" class="back-home">Back to the home</a>
        </div>

        

    </section>

</div>

</main>

<script src="js/auth.js"></script>

</body>

</html>
