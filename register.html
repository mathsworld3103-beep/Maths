<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | MathsWorld</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/auth.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>


<!-- ================= REGISTER ================= -->

<main class="auth-page register-page">

    <div class="auth-container register-container">

        <section class="auth-card register-card">

            <div class="auth-card-header">

                <div class="auth-icon">

                    <i class="fa-solid fa-user-plus"></i>

                </div>

                <h2>Create Account</h2>

                <p>
                    Register as a MathsWorld student
                </p>

            </div>


            <form id="registerForm" class="auth-form">


                <!-- NAME -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <div class="input-box">

                        <i class="fa-regular fa-user"></i>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <div class="input-box">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-phone"></i>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>

                </div>


                <!-- GRADE -->

                <div class="form-group">

                    <label for="grade">
                        Select Grade
                    </label>

                    <div class="input-box select-box">

                        <i class="fa-solid fa-graduation-cap"></i>

                        <select id="grade" required>

                            <option value="">
                                Select your grade
                            </option>

                            <option value="Grade 6">
                                Grade 6
                            </option>

                            <option value="Grade 7">
                                Grade 7
                            </option>

                            <option value="Grade 8">
                                Grade 8
                            </option>

                            <option value="Grade 9">
                                Grade 9
                            </option>

                            <option value="Grade 10">
                                Grade 10
                            </option>

                            <option value="Grade 11">
                                Grade 11
                            </option>

                            <option value="Grade 12">
                                Grade 12
                            </option>

                            <option value="Grade 13">
                                Grade 13
                            </option>

                        </select>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="registerPassword"
                                placeholder="Password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="registerPassword"
                            >

                                <i class="fa-regular fa-eye"></i>

                            </button>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="confirmPassword"
                            >

                                <i class="fa-regular fa-eye"></i>

                            </button>

                        </div>

                    </div>

                </div>


                <!-- TERMS -->

                <label class="terms-check">

                    <input type="checkbox" id="terms" required>

                    <span>
                        I agree to the
                        <a href="#">Terms & Conditions</a>
                        and
                        <a href="#">Privacy Policy</a>.
                    </span>

                </label>


                <button type="submit" class="auth-btn">

                    <span>Create Account</span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>


                <div id="registerMessage" class="auth-message"></div>

            </form>


            <div class="auth-divider">

                <span>Already have an account?</span>

            </div>


            <a href="login.html" class="register-btn">

                <i class="fa-solid fa-right-to-bracket"></i>

                Login to Account

            </a>

            <div class="back">
                <a href="index.html" class="back-home">Back to the home</a>
            </div>

        </section>

    </div>

</main>

<script src="js/auth.js"></script>

</body>
</html>
